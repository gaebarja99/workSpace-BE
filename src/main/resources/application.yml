spring:
  application:
    name: teamsync-back
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway가 관리, Hibernate는 검증만 수행
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  # 이메일 발송(구성원 초대, FR-409 보고서 내보내기)용 SMTP. 기본값(빈 host)에서는 실발송을 켜지
  # 않으므로(email.enabled=false) 이 설정은 사용되지 않는다. 배포 환경에서 SMTP_HOST 등을 주입하고
  # EMAIL_ENABLED=true로 켠다.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

server:
  port: ${SERVER_PORT:8080}

# 최소한의 actuator 노출만 허용(NFR-보안, 3.6): health 엔드포인트만 열고 상세 정보는
# 인증된 요청에서만 노출한다(when-authorized). SecurityConfig의 permitAll은 상태 확인용으로 유지.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  # 회귀 방지: spring.mail.* 자동설정이 뜨면 MailHealthIndicator가 SMTP 접속을 시도해,
  # 이메일 비활성(기본) 환경에서 /actuator/health가 상시 DOWN(503)이 된다. mail health check는 끄고
  # 실발송 여부는 email.enabled로만 판단한다(핵심 API가 정상이면 health는 UP이어야 함).
  health:
    mail:
      enabled: false

# FR-002: JWT 발급/검증 설정. local 프로필 기본값은 개발 편의용이며 dev/운영 환경에서는
# 반드시 JWT_SECRET 환경변수로 오버라이드할 것 (HS256 기준 최소 256bit/32byte 권장)
teamsync:
  jwt:
    secret: ${JWT_SECRET:teamsync-local-dev-only-secret-key-please-change-32bytes+}
    access-token-expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1시간
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 이메일 발송기 설정. 구성원 초대 메일과 FR-409 보고서 내보내기
# 이메일에 공통으로 쓰인다. 기본 비활성(로그 Mock)이며, 배포 env에서 켠다.
# email.enabled=true & 위 spring.mail SMTP 설정 존재 시 JavaMailSender 실발송, 그 외에는 로그 Mock.
email:
  enabled: ${EMAIL_ENABLED:false}
  from: ${EMAIL_FROM:no-reply@teamsync.local}

# 구성원 관리(P1): 초대 이메일에 담을 프론트엔드 링크(예: {frontend-base-url}/invite/{token}) 베이스 URL.
app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
